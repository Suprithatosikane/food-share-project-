
services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: annasetu_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - annasetu_network
    restart: unless-stopped

  # Complete Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: annasetu_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/anna_setu
      - JWT_SECRET=annasetu_secret_key_2026
    depends_on:
      - mongodb
    networks:
      - annasetu_network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  # React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: annasetu_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - annasetu_network
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  annasetu_network:
    driver: bridge
